name: Ranking checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --group dev
      - run: uv run --locked python -W error::ResourceWarning -m unittest discover -s scripts -p 'test_*.py'
      - run: uv run --locked ruff check --preview scripts
      - run: uv run --locked ruff format --check scripts
      - run: uv run --locked basedpyright scripts
      - run: uv run --locked vulture
