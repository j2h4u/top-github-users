name: Kazakhstan fixed-period ranking
on:
  workflow_dispatch:
    inputs:
      full_coverage:
        description: 'Expand beyond the upstream 1,000 search-result selection (slow)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    name: Kazakhstan fixed-period ranking
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recalculate
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_TOKEN || github.token }}
          FULL_COVERAGE: ${{ inputs.full_coverage }}
        run: python scripts/kazakhstan_ranking.py
      - name: Save results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/kazakhstan-fixed-period.json markdown/public_contributions/kazakhstan.md markdown/total_contributions/kazakhstan.md
          if ! git diff --cached --quiet; then
            git commit -m 'Recalculate Kazakhstan for fixed period'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kazakhstan-fixed-period
          path: |
            cache/kazakhstan-fixed-period.json
            markdown/public_contributions/kazakhstan.md
            markdown/total_contributions/kazakhstan.md
